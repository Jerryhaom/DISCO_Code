name: Portable analysis smoke checks
on: [push, pull_request, workflow_dispatch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: Rscript verify_release.R
      - run: Rscript run.R 01_method_definition/run_method_smoke_test.R
      - run: python -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('.').rglob('*.py')]"
      - name: Install released DISCO4HD
        run: Rscript -e 'install.packages("remotes", repos="https://cloud.r-project.org"); remotes::install_github("Jerryhaom/DISCO4HD@v0.3.0", upgrade="never")'
      - run: Rscript run.R 01_method_definition/run_synthetic_demo.R
      - run: Rscript run.R 10_biomarker_calculator/run_example.R
