name: Portable analysis smoke checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python verify_public_data.py --require-tracked
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: Rscript verify_release.R
      - run: Rscript tests/audit_metadata.R
      - run: Rscript tests/meta_input.R
      - run: Rscript tests/prs_joint.R
      - run: Rscript run.R 01_method_definition/run_method_smoke_test.R
      - run: python -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('.').rglob('*.py')]"
      - name: Install validated DISCO4HD commit
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript -e 'install.packages("remotes", repos="https://cloud.r-project.org"); remotes::install_github("Jerryhaom/DISCO4HD@a83dec9b5c9d7db8c111a8e39c0a26688e7b3184", upgrade="never"); stopifnot(identical(packageDescription("DISCO4HD")$RemoteSha, "a83dec9b5c9d7db8c111a8e39c0a26688e7b3184"))'
      - run: Rscript run.R 01_method_definition/run_synthetic_demo.R
      - run: Rscript run.R 10_biomarker_calculator/run_example.R
